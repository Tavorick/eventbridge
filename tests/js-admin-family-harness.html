<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>EventBridge admin family harness</title></head>
<body>
	<form id="event-form" data-fluent-available="1" data-woocommerce-available="1">
		<p id="eventbridge-family-conflict" hidden></p>
		<div id="eventbridge-trigger-list" data-next-index="2">
			<article class="eventbridge-trigger-card"><header class="eventbridge-trigger-card__header"><h4>Trigger 1</h4><button type="button" class="eventbridge-remove-trigger">Verwijder</button></header><input class="eventbridge-trigger-provider"><input class="eventbridge-trigger-type"><select class="eventbridge-trigger-kind"><option value="frontend:click" data-family="frontend_interaction" selected>Click</option><option value="frontend:pageview" data-family="frontend_interaction">Pageview</option><option value="woocommerce:order_lifecycle" data-family="server_lifecycle">Woo</option></select></article>
			<article class="eventbridge-trigger-card"><header class="eventbridge-trigger-card__header"><h4>Trigger 2</h4><button type="button" class="eventbridge-remove-trigger">Verwijder</button></header><input class="eventbridge-trigger-provider"><input class="eventbridge-trigger-type"><select class="eventbridge-trigger-kind"><option value="frontend:click" data-family="frontend_interaction" selected>Click</option><option value="frontend:pageview" data-family="frontend_interaction">Pageview</option><option value="woocommerce:order_lifecycle" data-family="server_lifecycle">Woo</option></select></article>
		</div>
		<button type="button" id="eventbridge-add-trigger">Toevoegen</button>
		<template id="eventbridge-trigger-template"><article class="eventbridge-trigger-card"><header class="eventbridge-trigger-card__header"><h4>Trigger</h4><button type="button" class="eventbridge-remove-trigger">Verwijder</button></header><input class="eventbridge-trigger-provider"><input class="eventbridge-trigger-type"><select class="eventbridge-trigger-kind"><option value="frontend:click" data-family="frontend_interaction" selected>Click</option><option value="frontend:pageview" data-family="frontend_interaction">Pageview</option><option value="woocommerce:order_lifecycle" data-family="server_lifecycle">Woo</option></select></article></template>
		<div id="eventbridge-event-channels"><p id="eventbridge-channel-explanation"></p><p id="eventbridge-channel-adjustment" hidden></p><input type="checkbox" id="eventbridge_event_browser" checked><input type="checkbox" id="eventbridge_event_capi"><input type="hidden" id="eventbridge_event_capi_required" disabled><p id="eventbridge-channel-error" hidden></p></div>
		<section id="eventbridge-event-diagnostics" hidden></section>
		<input type="checkbox" id="eventbridge_event_meta_test_mode"><div id="eventbridge-meta-test-event-code-field"><input id="eventbridge_event_meta_test_event_code"></div>
		<button id="eventbridge-event-submit" type="submit">Opslaan</button>
	</form>
	<script src="../assets/js/eventbridge-event-parameters.js"></script>
	<script>
	( function () {
		var errors = [];
		var list = document.getElementById( 'eventbridge-trigger-list' );
		var kinds = list.querySelectorAll( '.eventbridge-trigger-kind' );
		kinds[0].value = 'woocommerce:order_lifecycle';
		kinds[0].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		if ( document.getElementById( 'eventbridge-family-conflict' ).hidden ) { errors.push( 'missing conflict' ); }
		if ( ! document.getElementById( 'eventbridge-event-submit' ).disabled ) { errors.push( 'submit not blocked' ); }
		if ( document.getElementById( 'eventbridge_event_browser' ).checked || ! document.getElementById( 'eventbridge_event_capi' ).checked ) { errors.push( 'server channels invalid' ); }
		kinds[1].value = 'woocommerce:order_lifecycle';
		kinds[1].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		if ( ! document.getElementById( 'eventbridge-family-conflict' ).hidden ) { errors.push( 'conflict not cleared' ); }
		kinds[0].value = 'frontend:pageview';
		kinds[0].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		kinds[1].value = 'frontend:click';
		kinds[1].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		document.getElementById( 'eventbridge-add-trigger' ).click();
		var added = list.querySelectorAll( '.eventbridge-trigger-kind' )[2];
		if ( ! added || added.selectedOptions[0].getAttribute( 'data-family' ) !== 'frontend_interaction' ) { errors.push( 'incompatible add' ); }
		var ids = Array.prototype.map.call( document.querySelectorAll( '[id]' ), function ( element ) { return element.id; } );
		if ( new Set( ids ).size !== ids.length ) { errors.push( 'duplicate ids' ); }
		document.body.setAttribute( 'data-status', errors.length ? errors.join( ', ' ) : 'passed' );
	}() );
	</script>
</body>
</html>
