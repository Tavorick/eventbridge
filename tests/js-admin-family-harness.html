<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>EventBridge admin family harness</title></head>
<body>
	<form id="event-form" data-fluent-available="1" data-woocommerce-available="1">
		<p id="eventbridge-family-conflict" hidden></p>
		<div id="eventbridge-trigger-list" data-next-index="2">
			<article class="eventbridge-trigger-card is-expanded"><header class="eventbridge-trigger-card__header"><button type="button" class="eventbridge-trigger-toggle" aria-expanded="true" aria-controls="eventbridge-trigger-panel-0"><span><strong class="eventbridge-trigger-title">Trigger 1</strong><span class="eventbridge-trigger-summary">CSS-selector</span></span></button><button type="button" class="eventbridge-remove-trigger">Verwijder</button></header><div class="eventbridge-trigger-card__body" id="eventbridge-trigger-panel-0"><input class="eventbridge-trigger-provider"><input class="eventbridge-trigger-type"><select class="eventbridge-trigger-kind" aria-describedby="eventbridge-trigger-family-help-0"><option value="frontend:click" data-family="frontend_interaction" selected>CSS-selector</option><option value="frontend:pageview" data-family="frontend_interaction">Paginabezoek</option><option value="woocommerce:order_lifecycle" data-family="server_lifecycle">WooCommerce</option></select><p id="eventbridge-trigger-family-help-0">Frontendtriggers en backendtriggers kunnen niet binnen hetzelfde event worden gecombineerd.</p></div></article>
			<article class="eventbridge-trigger-card"><header class="eventbridge-trigger-card__header"><button type="button" class="eventbridge-trigger-toggle" aria-expanded="false" aria-controls="eventbridge-trigger-panel-1"><span><strong class="eventbridge-trigger-title">Trigger 2</strong><span class="eventbridge-trigger-summary">CSS-selector</span></span></button><button type="button" class="eventbridge-remove-trigger">Verwijder</button></header><div class="eventbridge-trigger-card__body" id="eventbridge-trigger-panel-1" hidden><input class="eventbridge-trigger-provider"><input class="eventbridge-trigger-type"><select class="eventbridge-trigger-kind" aria-describedby="eventbridge-trigger-family-help-1"><option value="frontend:click" data-family="frontend_interaction" selected>CSS-selector</option><option value="frontend:pageview" data-family="frontend_interaction">Paginabezoek</option><option value="woocommerce:order_lifecycle" data-family="server_lifecycle">WooCommerce</option></select><p id="eventbridge-trigger-family-help-1">Frontendtriggers en backendtriggers kunnen niet binnen hetzelfde event worden gecombineerd.</p></div></article>
		</div>
		<button type="button" id="eventbridge-add-trigger">Toevoegen</button>
		<template id="eventbridge-trigger-template"><article class="eventbridge-trigger-card is-expanded"><header class="eventbridge-trigger-card__header"><button type="button" class="eventbridge-trigger-toggle" aria-expanded="true" aria-controls="eventbridge-trigger-panel-__TRIGGER__"><span><strong class="eventbridge-trigger-title">Trigger</strong><span class="eventbridge-trigger-summary">CSS-selector</span></span></button><button type="button" class="eventbridge-remove-trigger">Verwijder</button></header><div class="eventbridge-trigger-card__body" id="eventbridge-trigger-panel-__TRIGGER__"><input class="eventbridge-trigger-provider"><input class="eventbridge-trigger-type"><select class="eventbridge-trigger-kind" aria-describedby="eventbridge-trigger-family-help-__TRIGGER__"><option value="frontend:click" data-family="frontend_interaction" selected>CSS-selector</option><option value="frontend:pageview" data-family="frontend_interaction">Paginabezoek</option><option value="woocommerce:order_lifecycle" data-family="server_lifecycle">WooCommerce</option></select><p id="eventbridge-trigger-family-help-__TRIGGER__">Frontendtriggers en backendtriggers kunnen niet binnen hetzelfde event worden gecombineerd.</p></div></article></template>
		<div id="eventbridge-event-channels"><p id="eventbridge-channel-explanation"></p><p id="eventbridge-channel-adjustment" hidden></p><input type="checkbox" id="eventbridge_event_browser" checked><input type="checkbox" id="eventbridge_event_capi"><input type="hidden" id="eventbridge_event_capi_required" disabled><p id="eventbridge-channel-error" hidden></p></div>
		<section id="eventbridge-event-diagnostics" hidden></section>
		<input type="checkbox" id="eventbridge_event_meta_test_mode"><div id="eventbridge-meta-test-event-code-field"><input id="eventbridge_event_meta_test_event_code"></div>
		<button id="eventbridge-event-submit" type="submit">Opslaan</button>
	</form>
	<script src="../assets/js/eventbridge-event-parameters.js"></script>
	<script>
	( function () {
		var errors = [];
		var list = document.getElementById( 'eventbridge-trigger-list' );
		var kinds = list.querySelectorAll( '.eventbridge-trigger-kind' );
		var cards = list.querySelectorAll( '.eventbridge-trigger-card' );
		if ( cards[0].querySelector( '.eventbridge-trigger-toggle' ).getAttribute( 'aria-expanded' ) !== 'true' || cards[1].querySelector( '.eventbridge-trigger-toggle' ).getAttribute( 'aria-expanded' ) !== 'false' ) { errors.push( 'initial collapse state' ); }
		if ( kinds[1].options[2].hidden || ! kinds[1].options[2].disabled || ! kinds[1].getAttribute( 'aria-describedby' ) ) { errors.push( 'frontend disabled option' ); }
		cards[1].querySelector( '.eventbridge-trigger-toggle' ).click();
		if ( cards[1].querySelector( '.eventbridge-trigger-card__body' ).hidden ) { errors.push( 'toggle open' ); }
		kinds[0].value = 'woocommerce:order_lifecycle';
		kinds[0].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		if ( document.getElementById( 'eventbridge-family-conflict' ).hidden ) { errors.push( 'missing conflict' ); }
		if ( ! document.getElementById( 'eventbridge-event-submit' ).disabled ) { errors.push( 'submit not blocked' ); }
		if ( document.getElementById( 'eventbridge_event_browser' ).checked || ! document.getElementById( 'eventbridge_event_capi' ).checked ) { errors.push( 'server channels invalid' ); }
		kinds[1].value = 'woocommerce:order_lifecycle';
		kinds[1].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		if ( ! document.getElementById( 'eventbridge-family-conflict' ).hidden ) { errors.push( 'conflict not cleared' ); }
		kinds[0].value = 'frontend:pageview';
		kinds[0].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		kinds[1].value = 'frontend:click';
		kinds[1].dispatchEvent( new Event( 'change', { bubbles: true } ) );
		document.getElementById( 'eventbridge-add-trigger' ).click();
		var added = list.querySelectorAll( '.eventbridge-trigger-kind' )[2];
		if ( ! added || added.selectedOptions[0].getAttribute( 'data-family' ) !== 'frontend_interaction' ) { errors.push( 'incompatible add' ); }
		if ( added.closest( '.eventbridge-trigger-card' ).querySelector( '.eventbridge-trigger-card__body' ).hidden ) { errors.push( 'new trigger closed' ); }
		added.closest( '.eventbridge-trigger-card' ).querySelector( '.eventbridge-remove-trigger' ).click();
		if ( list.querySelectorAll( '.eventbridge-trigger-card' ).length !== 2 || list.querySelectorAll( '.eventbridge-trigger-title' )[1].textContent !== 'Trigger 2' ) { errors.push( 'remove or renumber' ); }
		var ids = Array.prototype.map.call( document.querySelectorAll( '[id]' ), function ( element ) { return element.id; } );
		if ( new Set( ids ).size !== ids.length ) { errors.push( 'duplicate ids' ); }
		document.body.setAttribute( 'data-status', errors.length ? errors.join( ', ' ) : 'passed' );
	}() );
	</script>
</body>
</html>
