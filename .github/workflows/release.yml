name: Validate and release EventBridge

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: eventbridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '7.0.2'
            php: '7.4'
          - wordpress: '7.0.2'
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.10.2
          github-token: ''
      - name: Install locked test support
        run: composer install --no-interaction --no-progress --no-scripts --no-plugins
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y subversion
          svn --version --quiet
      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-${{ matrix.wordpress }}
        run: bash tools/test/install-wp-tests.sh eventbridge_test root root 127.0.0.1 ${{ matrix.wordpress }}
      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-${{ matrix.wordpress }}
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  compatibility-wordpress-58:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '7.4'
          coverage: none
          tools: wp-cli:2.12.0
          github-token: ''
      - name: Install and activate on WordPress 5.8.10
        shell: bash
        run: |
          site=/tmp/eventbridge-wordpress-58
          mkdir -p "$site"
          wp core download --path="$site" --version=5.8.10 --force
          wp core verify-checksums --path="$site" --version=5.8.10
          mysqladmin --host=127.0.0.1 --user=root --password=root create eventbridge_wordpress_58
          wp config create --path="$site" --dbname=eventbridge_wordpress_58 --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$site" --url=http://localhost --title=EventBridge --admin_user=admin --admin_password=local-test-only --admin_email=admin@example.test --skip-email
          plugin="$site/wp-content/plugins/eventbridge"
          mkdir -p "$plugin"
          cp eventbridge.php "$plugin/"
          rsync -a includes assets "$plugin/"
          if [[ -d languages ]]; then
            rsync -a languages "$plugin/"
          fi
          wp plugin activate eventbridge --path="$site"
          wp plugin is-active eventbridge --path="$site"
      - name: Verify minimum-version runtime contract
        shell: bash
        run: |
          site=/tmp/eventbridge-wordpress-58
          wp eval --path="$site" '
          require_once ABSPATH . "wp-admin/includes/plugin.php";
          $plugin_data = get_plugin_data( WP_PLUGIN_DIR . "/eventbridge/eventbridge.php", false, false );
          $checks = array(
              "wordpress_version" => "5.8.10" === get_bloginfo( "version" ),
              "requires_wordpress" => isset( $plugin_data["RequiresWP"] ) && "5.8" === $plugin_data["RequiresWP"],
              "version_constant" => defined( "EVENTBRIDGE_VERSION" ),
              "events_runtime" => class_exists( "EventBridge_Events" ),
              "installer_runtime" => class_exists( "EventBridge_Installer" ),
              "database_version" => defined( "EVENTBRIDGE_DB_VERSION" ) && EVENTBRIDGE_DB_VERSION === absint( get_option( EventBridge_Installer::DB_VERSION_OPTION, 0 ) ),
              "cleanup_schedule" => false !== wp_next_scheduled( EventBridge_Log::CLEANUP_HOOK ),
          );
          $failed = array_keys( array_filter( $checks, function ( $passed ) { return ! $passed; } ) );
          if ( ! empty( $failed ) ) {
              throw new RuntimeException( "WordPress 5.8 compatibility smoke failed: " . implode( ", ", $failed ) );
          }
          '

  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '7.4'
          coverage: none
          github-token: ''
      - name: Verify checked out tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
      - name: Whitespace checks
        shell: bash
        run: |
          git diff --check
          git show --check --oneline --no-renames HEAD
      - name: PHP 7.4 lint
        shell: bash
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - name: JavaScript syntax
        shell: bash
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Browser harnesses
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: php tools/test/run-browser-harnesses.php
      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' eventbridge.php | head -n1)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Exercise release policy failures
        run: php tools/release/self-test.php
      - name: Build and verify release package
        shell: bash
        run: |
          expected_tag="v${{ steps.version.outputs.version }}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            expected_tag="$GITHUB_REF_NAME"
          fi
          php tools/release/build.php --output=dist --ref=HEAD --tag="$expected_tag"
          php tools/release/verify.php "dist/eventbridge-${{ steps.version.outputs.version }}.zip" "${{ steps.version.outputs.version }}"
          (
            cd dist
            sha256sum --check "eventbridge-${{ steps.version.outputs.version }}.zip.sha256"
          )
      - name: Upload temporary workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: eventbridge-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/eventbridge-${{ steps.version.outputs.version }}.zip
            dist/eventbridge-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  integration:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '7.4'
          coverage: none
          tools: wp-cli:2.12.0
          github-token: ''
      - name: Create local WordPress and WooCommerce site
        shell: bash
        run: |
          mkdir -p /tmp/eventbridge-site
          wp core download --path=/tmp/eventbridge-site --version=7.0.2 --force
          wp config create --path=/tmp/eventbridge-site --dbname=eventbridge_site --dbuser=root --dbpass=root --dbhost=127.0.0.1 --extra-php <<'PHP'
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          PHP
          mysqladmin --host=127.0.0.1 --user=root --password=root create eventbridge_site
          wp core install --path=/tmp/eventbridge-site --url=http://localhost --title=EventBridge --admin_user=admin --admin_password=local-test-only --admin_email=admin@example.test --skip-email
          mkdir -p /tmp/eventbridge-site/wp-content/plugins/eventbridge
          rsync -a --exclude=.git ./ /tmp/eventbridge-site/wp-content/plugins/eventbridge/
          wp plugin install woocommerce --path=/tmp/eventbridge-site --version=10.9.4 --activate
          wp plugin activate eventbridge --path=/tmp/eventbridge-site
      - name: Run local PHP harnesses
        shell: bash
        run: |
          plugin=/tmp/eventbridge-site/wp-content/plugins/eventbridge
          php "$plugin/tests/local-admin-render-harness.php"
          php "$plugin/tests/local-trigger-family-harness.php"
          php "$plugin/tests/local-woocommerce-interactions-harness.php"
          php "$plugin/tests/local-woocommerce-harness.php" create
          trap 'php "$plugin/tests/local-woocommerce-harness.php" cleanup' EXIT
          php "$plugin/tests/local-woocommerce-harness.php" run current
          php "$plugin/tests/local-woocommerce-harness.php" cleanup
          trap - EXIT
      - name: Run 1.2.0 rollback harness
        shell: bash
        run: |
          plugin=/tmp/eventbridge-site/wp-content/plugins/eventbridge
          mkdir -p /tmp/eventbridge-1.2.0
          git archive 1b39ebe1fe29fb9b42041dae4ca52d5ddec8b995 | tar -x -C /tmp/eventbridge-1.2.0
          php "$plugin/tests/local-rollback-120-harness.php" prepare
          php "$plugin/tests/local-rollback-120-harness.php" run /tmp/eventbridge-1.2.0
          php "$plugin/tests/local-rollback-120-harness.php" verify
          php "$plugin/tests/local-rollback-120-harness.php" cleanup

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, compatibility-wordpress-58, package, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: eventbridge-${{ needs.package.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Publish immutable release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$TAG" == *-rc.* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$TAG" "${prerelease[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "dist/eventbridge-${VERSION}.zip" "dist/eventbridge-${VERSION}.zip.sha256"
          local_zip_digest="sha256:$(sha256sum "dist/eventbridge-${VERSION}.zip" | cut -d' ' -f1)"
          local_sum_digest="sha256:$(sha256sum "dist/eventbridge-${VERSION}.zip.sha256" | cut -d' ' -f1)"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq '[.assets[] | select(.name == "eventbridge-'"${VERSION}"'.zip")] | length' <<<"$release_json")" = 1
          test "$(jq '[.assets[] | select(.name == "eventbridge-'"${VERSION}"'.zip.sha256")] | length' <<<"$release_json")" = 1
          test "$(jq -r '.assets[] | select(.name == "eventbridge-'"${VERSION}"'.zip") | .digest' <<<"$release_json")" = "$local_zip_digest"
          test "$(jq -r '.assets[] | select(.name == "eventbridge-'"${VERSION}"'.zip.sha256") | .digest' <<<"$release_json")" = "$local_sum_digest"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
